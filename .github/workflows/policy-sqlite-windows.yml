name: Policy SQLite - manual isolated Native Windows collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_VERSION: 45.0.0
      ELECTRON_ARCHIVE_SHA256: ae53887a23bb640369c93dbd38c408a2af5c0deb86f2fa76c6c244cb444b7f47
    steps:
      - name: Reserve isolated runtime paths; public output must remain absent for driver exclusivity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "policy-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $out = Join-Path $env:RUNNER_TEMP "policy-public-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root | Out-Null
          if (Test-Path -LiteralPath $out) { throw 'Refusing existing public output' }
          "POLICY_NATIVE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "POLICY_NATIVE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $drive = [IO.Path]::GetPathRoot($root).Substring(0, 1)
          $volume = Get-Volume -DriveLetter $drive
          @{classification='PUBLIC'; fileSystem=$volume.FileSystem; architecture=$env:PROCESSOR_ARCHITECTURE; scope='Policy+SQLite only; not app/NSIS/production/durability'} | ConvertTo-Json | Set-Content (Join-Path $root 'preflight-public.json')
          if ($volume.FileSystem -ne 'NTFS') { throw 'Native collection requires measured NTFS' }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Install existing locked dependencies with lifecycle scripts disabled
        shell: pwsh
        run: |
          & npm ci --ignore-scripts --prefix experiments/update-auth-windows
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
      - name: Verify reviewed core and frozen Windows gate before Native
        shell: pwsh
        run: |
          & git diff --exit-code f01a3b97eabfc676e6d46cec62839dd3fda10f27 -- experiments/update-auth-policy-sqlite/policy.cjs experiments/update-auth-policy-sqlite/store.cjs experiments/update-auth-policy-sqlite/test.cjs experiments/update-auth-policy-sqlite/run-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed core changed' }
          & git diff --exit-code a5ea2b6 -- experiments/update-auth-windows
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Windows gate changed' }
          & git diff --exit-code f01a3b97eabfc676e6d46cec62839dd3fda10f27 -- experiments/update-auth-sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Frozen SQLite capability source changed' }
          $files = & git ls-files experiments/update-auth-policy-sqlite experiments/update-auth-windows experiments/update-auth-sqlite .github/workflows/policy-sqlite-check.yml .github/workflows/policy-sqlite-windows.yml
          $hashes = @($files | ForEach-Object { @{path=$_; sha256=(Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()} })
          $hashes | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:POLICY_NATIVE_ROOT 'source-before-public.json')
      - name: Fetch only the exact official Electron archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:POLICY_NATIVE_ROOT 'electron.zip'
          $url = "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION/electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Official Electron download failed' }
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -ne $env:ELECTRON_ARCHIVE_SHA256) { throw 'Official archive SHA256 mismatch' }
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:POLICY_NATIVE_ROOT 'electron')
          $exe = Join-Path $env:POLICY_NATIVE_ROOT 'electron/electron.exe'
          @{classification='PUBLIC'; version=$env:ELECTRON_VERSION; archive_sha256=$digest; executable_sha256=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant(); original_head=(& git rev-parse HEAD)} | ConvertTo-Json | Set-Content (Join-Path $env:POLICY_NATIVE_ROOT 'runtime-download-public.json')
      - name: Collect real Electron Policy matrix; blocked/error/native false fails the job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:POLICY_NATIVE_ROOT 'electron/electron.exe'
          & node experiments/update-auth-policy-sqlite/driver.cjs --electron $exe --out $env:POLICY_NATIVE_OUT
          if ($LASTEXITCODE -ne 0) { throw 'Native Policy collection failed or blocked; inspect public evidence' }
          $receipt = Get-Content -Raw (Join-Path $env:POLICY_NATIVE_OUT 'result.json') | ConvertFrom-Json
          if ($receipt.status -ne 'PASS' -or $receipt.nativeElectron -ne $true) { throw 'No Native Policy PASS' }
      - name: Check immutability and preserve bounded public provenance, even on failure
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:POLICY_NATIVE_OUT)) { New-Item -ItemType Directory -Path $env:POLICY_NATIVE_OUT | Out-Null }
          foreach ($name in @('preflight-public.json', 'runtime-download-public.json', 'source-before-public.json')) {
            $source = Join-Path $env:POLICY_NATIVE_ROOT $name
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $env:POLICY_NATIVE_OUT $name) -ErrorAction Stop }
          }
          $before = Get-Content -Raw (Join-Path $env:POLICY_NATIVE_ROOT 'source-before-public.json') | ConvertFrom-Json
          foreach ($record in $before) { if ((Get-FileHash -Algorithm SHA256 $record.path).Hash.ToLowerInvariant() -ne $record.sha256) { throw "Source changed: $($record.path)" } }
          & git diff --exit-code f01a3b97eabfc676e6d46cec62839dd3fda10f27 -- experiments/update-auth-policy-sqlite/policy.cjs experiments/update-auth-policy-sqlite/store.cjs experiments/update-auth-policy-sqlite/test.cjs experiments/update-auth-policy-sqlite/run-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed core changed during collection' }
          & git diff --exit-code a5ea2b6 -- experiments/update-auth-windows
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Windows gate changed during collection' }
          & git diff --exit-code f01a3b97eabfc676e6d46cec62839dd3fda10f27 -- experiments/update-auth-sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Frozen SQLite capability source changed' }
      - name: Upload ONLY classified public evidence; never private TLS roots or runtime ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-sqlite-native-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/policy-public-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
