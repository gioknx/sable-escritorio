name: Electron SQLite probe - source checks

on:
  pull_request:
    paths:
      - 'experiments/update-auth-sqlite/**'
      - '.github/workflows/sqlite-capability*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Syntax and UNIT only, never Windows proof
        run: |
          node --check experiments/update-auth-sqlite/electron-main.cjs
          node --check experiments/update-auth-sqlite/driver.cjs
          node --check experiments/update-auth-sqlite/probe.test.cjs
          node --test experiments/update-auth-sqlite/probe.test.cjs
